name: Simulation smoke test

on:
  workflow_dispatch:
  push:
    paths:
      - 'notears_bp.py'
      - 'reproduce_simulations.py'
      - 'requirements.txt'
      - '.github/workflows/reproduce-primary.yml'
  pull_request:
    paths:
      - 'notears_bp.py'
      - 'reproduce_simulations.py'
      - 'requirements.txt'
      - '.github/workflows/reproduce-primary.yml'

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run small reproducibility check
        run: |
          python reproduce_simulations.py \
            --d 10 \
            --weight-kind uniform \
            --M 1 \
            --n-jobs 1 \
            --out results/smoke_test
      - name: Verify expected outputs
        run: |
          test -s results/smoke_test/replicate_metrics.csv
          test -s results/smoke_test/summary.csv
          test -s results/smoke_test/combined.pdf
