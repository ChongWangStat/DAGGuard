name: Finish d40 primary simulation single replicates

on:
  push:
    paths:
      - '.github/workflows/reproduce-d40-final-single-reps.yml'
  workflow_dispatch:

jobs:
  final-replicates:
    strategy:
      fail-fast: false
      matrix:
        include:
          - weight_kind: uniform
            s: 4
            rep: 0
          - weight_kind: uniform
            s: 4
            rep: 1
          - weight_kind: uniform
            s: 4
            rep: 2
          - weight_kind: uniform
            s: 4
            rep: 3
          - weight_kind: uniform
            s: 4
            rep: 4
          - weight_kind: modnormal
            s: 1
            rep: 0
          - weight_kind: modnormal
            s: 1
            rep: 1
          - weight_kind: modnormal
            s: 1
            rep: 2
          - weight_kind: modnormal
            s: 1
            rep: 3
          - weight_kind: modnormal
            s: 1
            rep: 4
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install recovered Colab environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            numpy==2.0.2 \
            scipy==1.16.3 \
            scikit-learn==1.6.1 \
            networkx==3.6.1 \
            pandas==2.2.2 \
            matplotlib==3.10.0 \
            joblib==1.5.3 \
            causal-learn==0.1.4.4 \
            python-igraph==1.0.0 \
            lingam==1.12.1
      - name: Run one replicate
        run: |
          python run_primary_d40_subchunk.py \
            --weight-kind ${{ matrix.weight_kind }} \
            --s ${{ matrix.s }} \
            --rep-start ${{ matrix.rep }} \
            --rep-count 1 \
            --n-jobs 1 \
            --out results/${{ matrix.weight_kind }}_s${{ matrix.s }}_rep${{ matrix.rep }}
      - name: Upload replicate result
        uses: actions/upload-artifact@v4
        with:
          name: d40-${{ matrix.weight_kind }}-s${{ matrix.s }}-rep${{ matrix.rep }}
          path: results/${{ matrix.weight_kind }}_s${{ matrix.s }}_rep${{ matrix.rep }}/
          retention-days: 30
