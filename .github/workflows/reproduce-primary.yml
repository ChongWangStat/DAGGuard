name: Tests and reproducibility smoke test

on:
  workflow_dispatch:
  push:
    paths:
      - 'dagguard.py'
      - 'local_bic_refinement.py'
      - 'examples/**'
      - 'benchmarks/**'
      - 'example_simulation.py'
      - 'make_manuscript_assets.py'
      - 'candidate_contamination_simulations.py'
      - 'tests/**'
      - 'reproduce_simulations.py'
      - 'simulation_diagnostics.py'
      - 'additional_noise_sensitivity.py'
      - 'notears_tuning_sensitivity.py'
      - 'synthetic_application_twin.py'
      - 'reproduce_submission.sh'
      - 'realdata_postselection_diagnostics.py'
      - 'requirements.txt'
      - '.github/workflows/reproduce-primary.yml'
  pull_request:
    paths:
      - 'dagguard.py'
      - 'local_bic_refinement.py'
      - 'examples/**'
      - 'benchmarks/**'
      - 'tests/**'
      - 'reproduce_simulations.py'
      - 'candidate_contamination_simulations.py'
      - 'additional_noise_sensitivity.py'
      - 'notears_tuning_sensitivity.py'
      - 'synthetic_application_twin.py'
      - 'reproduce_submission.sh'
      - 'requirements.txt'
      - '.github/workflows/reproduce-primary.yml'

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Check source syntax
        run: |
          python -m py_compile \
            dagguard.py \
            local_bic_refinement.py \
            examples/dagguard_quickstart.py \
            benchmarks/seven_method/common.py \
            benchmarks/seven_method/pc_fdr.py \
            benchmarks/seven_method/pc_original.py \
            benchmarks/seven_method/pcp_faithful.py \
            benchmarks/seven_method/wang_full.py \
            benchmarks/seven_method/wang_sensitivity.py \
            benchmarks/seven_method/wang_fixed_candidate.py \
            benchmarks/seven_method/reproduce_external_simulations.py \
            benchmarks/seven_method/swine_benchmark.py \
            reproduce_simulations.py \
            additional_noise_sensitivity.py \
            notears_tuning_sensitivity.py \
            synthetic_application_twin.py \
            realdata_postselection_diagnostics.py \
            candidate_contamination_simulations.py
          python -c "import dagguard; import benchmarks.seven_method.pcp_faithful; import benchmarks.seven_method.wang_sensitivity; import benchmarks.seven_method.wang_fixed_candidate; import benchmarks.seven_method.reproduce_external_simulations"
      - name: Run deterministic unit tests
        run: python -m unittest discover -s tests -v
      - name: Run DAGGuard quickstart
        run: python -m examples.dagguard_quickstart
      - name: Run synthetic application twin
        run: |
          python synthetic_application_twin.py --out results/synthetic_application_twin
          test -s results/synthetic_application_twin/summary.csv
      - name: Run small reproducibility check
        run: |
          python reproduce_simulations.py \
            --d 10 --weight-kind uniform --M 1 --n-jobs 1 \
            --out results/smoke_test
          test -s results/smoke_test/replicate_metrics.csv
          test -s results/smoke_test/summary.csv
      - name: Run fixed-candidate smoke test
        run: |
          python candidate_contamination_simulations.py \
            --replicates 1 --out results/contamination_smoke_test
          test -s results/contamination_smoke_test/exact_greedy_paired_summary.csv
      - name: Verify Wang fixed-candidate manuscript table
        run: |
          python -m benchmarks.seven_method.wang_fixed_candidate \
            --replicates 100 --check-manuscript \
            --out results/wang_fixed_candidate_audit
          test -s results/wang_fixed_candidate_audit/wang_fixed_candidate_replicates.csv
          test -s results/wang_fixed_candidate_audit/wang_fixed_candidate_summary.csv
      - name: Verify external seven-method comparator tables
        run: |
          python -m benchmarks.seven_method.reproduce_external_simulations \
            --replicates 20 --check-manuscript \
            --out results/external_comparator_audit
          test -s results/external_comparator_audit/external_comparator_replicates.csv
          test -s results/external_comparator_audit/external_comparator_summary.csv
          test -s results/external_comparator_audit/wang_threshold_summary.csv
