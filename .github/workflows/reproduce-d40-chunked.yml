name: Reproduce d40 primary simulation figures

on:
  push:
    paths:
      - 'run_primary_d40_chunk.py'
      - 'merge_primary_d40_chunks.py'
      - 'reproduce_primary_simulations.py'
      - '.github/workflows/reproduce-d40-chunked.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reproduce-d40-primary
  cancel-in-progress: false

jobs:
  run-d40-chunks:
    name: d40-${{ matrix.weight_kind }}-s${{ matrix.s }}
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include:
          - weight_kind: uniform
            s: 1
          - weight_kind: uniform
            s: 4
          - weight_kind: uniform
            s: 7
          - weight_kind: uniform
            s: 10
          - weight_kind: modnormal
            s: 1
          - weight_kind: modnormal
            s: 2
          - weight_kind: modnormal
            s: 3
          - weight_kind: modnormal
            s: 4
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install recovered Colab environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            numpy==2.0.2 \
            scipy==1.16.3 \
            scikit-learn==1.6.1 \
            networkx==3.6.1 \
            pandas==2.2.2 \
            matplotlib==3.10.0 \
            joblib==1.5.3 \
            causal-learn==0.1.4.4 \
            python-igraph==1.0.0 \
            lingam==1.12.1
          python -m pip freeze > recovered_environment.txt

      - name: Run d40 ${{ matrix.weight_kind }} s=${{ matrix.s }}
        run: |
          python run_primary_d40_chunk.py \
            --weight-kind ${{ matrix.weight_kind }} \
            --s ${{ matrix.s }} \
            --M 20 \
            --n-jobs 2 \
            --out results/d40_${{ matrix.weight_kind }}_s${{ matrix.s }}

      - name: Record provenance
        run: |
          cp recovered_environment.txt results/d40_${{ matrix.weight_kind }}_s${{ matrix.s }}/
          echo "commit=${GITHUB_SHA}" > results/d40_${{ matrix.weight_kind }}_s${{ matrix.s }}/github_provenance.txt
          echo "runner=${RUNNER_OS}" >> results/d40_${{ matrix.weight_kind }}_s${{ matrix.s }}/github_provenance.txt
          echo "workflow_run_id=${GITHUB_RUN_ID}" >> results/d40_${{ matrix.weight_kind }}_s${{ matrix.s }}/github_provenance.txt

      - name: Upload chunk results
        uses: actions/upload-artifact@v4
        with:
          name: d40-${{ matrix.weight_kind }}-s${{ matrix.s }}
          path: results/d40_${{ matrix.weight_kind }}_s${{ matrix.s }}/
          retention-days: 30

  merge-d40-panels:
    name: merge-d40-${{ matrix.weight_kind }}
    needs: run-d40-chunks
    if: ${{ needs.run-d40-chunks.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        weight_kind: [uniform, modnormal]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install plotting and validation environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            numpy==2.0.2 \
            scipy==1.16.3 \
            scikit-learn==1.6.1 \
            networkx==3.6.1 \
            pandas==2.2.2 \
            matplotlib==3.10.0 \
            joblib==1.5.3 \
            causal-learn==0.1.4.4 \
            python-igraph==1.0.0 \
            lingam==1.12.1

      - name: Download ${{ matrix.weight_kind }} chunks
        uses: actions/download-artifact@v4
        with:
          pattern: d40-${{ matrix.weight_kind }}-s*
          path: chunks
          merge-multiple: false

      - name: Validate, merge, summarize, and plot
        run: |
          python merge_primary_d40_chunks.py \
            --weight-kind ${{ matrix.weight_kind }} \
            --input chunks \
            --M 20 \
            --out results/d40_${{ matrix.weight_kind }}

      - name: Record merged provenance
        run: |
          echo "commit=${GITHUB_SHA}" > results/d40_${{ matrix.weight_kind }}/github_provenance.txt
          echo "runner=${RUNNER_OS}" >> results/d40_${{ matrix.weight_kind }}/github_provenance.txt
          echo "workflow_run_id=${GITHUB_RUN_ID}" >> results/d40_${{ matrix.weight_kind }}/github_provenance.txt

      - name: Upload complete d40 panel
        uses: actions/upload-artifact@v4
        with:
          name: primary-d40-${{ matrix.weight_kind }}
          path: results/d40_${{ matrix.weight_kind }}/
          retention-days: 30
