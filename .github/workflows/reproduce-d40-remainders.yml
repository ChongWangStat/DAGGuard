name: Complete d40 primary simulation rerun

on:
  push:
    paths:
      - 'run_primary_d40_subchunk.py'
      - 'merge_primary_d40_results.py'
      - '.github/workflows/reproduce-d40-remainders.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: d40-primary-remainders
  cancel-in-progress: false

jobs:
  rerun-unfinished:
    name: d40-${{ matrix.weight_kind }}-s${{ matrix.s }}-rep${{ matrix.rep_start }}
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        include:
          - weight_kind: uniform
            s: 4
            rep_start: 0
          - weight_kind: uniform
            s: 4
            rep_start: 5
          - weight_kind: uniform
            s: 4
            rep_start: 10
          - weight_kind: uniform
            s: 4
            rep_start: 15
          - weight_kind: uniform
            s: 10
            rep_start: 0
          - weight_kind: uniform
            s: 10
            rep_start: 5
          - weight_kind: uniform
            s: 10
            rep_start: 10
          - weight_kind: uniform
            s: 10
            rep_start: 15
          - weight_kind: modnormal
            s: 1
            rep_start: 0
          - weight_kind: modnormal
            s: 1
            rep_start: 5
          - weight_kind: modnormal
            s: 1
            rep_start: 10
          - weight_kind: modnormal
            s: 1
            rep_start: 15
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install recovered Colab environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            numpy==2.0.2 \
            scipy==1.16.3 \
            scikit-learn==1.6.1 \
            networkx==3.6.1 \
            pandas==2.2.2 \
            matplotlib==3.10.0 \
            joblib==1.5.3 \
            causal-learn==0.1.4.4 \
            python-igraph==1.0.0 \
            lingam==1.12.1
          python -m pip freeze > recovered_environment.txt
      - name: Run five-replicate block
        run: |
          out="results/d40_${{ matrix.weight_kind }}_s${{ matrix.s }}_rep${{ matrix.rep_start }}"
          python run_primary_d40_subchunk.py \
            --weight-kind "${{ matrix.weight_kind }}" \
            --s "${{ matrix.s }}" \
            --rep-start "${{ matrix.rep_start }}" \
            --rep-count 5 \
            --n-jobs 2 \
            --out "$out"
          cp recovered_environment.txt "$out/"
          {
            echo "commit=${GITHUB_SHA}"
            echo "runner=${RUNNER_OS}"
            echo "source_run=31956661625"
          } > "$out/github_provenance.txt"
      - name: Upload replicate block
        uses: actions/upload-artifact@v4
        with:
          name: d40-${{ matrix.weight_kind }}-s${{ matrix.s }}-rep${{ matrix.rep_start }}
          path: results/d40_${{ matrix.weight_kind }}_s${{ matrix.s }}_rep${{ matrix.rep_start }}/
          retention-days: 30

  merge-and-plot:
    name: Validate, merge, and plot complete d40 results
    needs: rerun-unfinished
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install merge and plotting dependencies
        run: python -m pip install numpy==2.0.2 pandas==2.2.2 matplotlib==3.10.0
      - name: Download five previously completed settings
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 31956661625
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: d40-*
          path: inputs/prior
      - name: Download new replicate blocks
        uses: actions/download-artifact@v4
        with:
          pattern: d40-*-rep*
          path: inputs/new
      - name: Validate completeness and generate vector figures
        run: |
          python merge_primary_d40_results.py \
            --input-root inputs/prior \
            --input-root inputs/new \
            --out results/d40_complete
      - name: Upload complete d40 uniform panel
        uses: actions/upload-artifact@v4
        with:
          name: primary-d40-uniform-complete
          path: results/d40_complete/d40_uniform/
          retention-days: 30
      - name: Upload complete d40 modified-normal panel
        uses: actions/upload-artifact@v4
        with:
          name: primary-d40-modnormal-complete
          path: results/d40_complete/d40_modnormal/
          retention-days: 30
      - name: Upload merge audit and all replicate metrics
        uses: actions/upload-artifact@v4
        with:
          name: primary-d40-complete-audit
          path: |
            results/d40_complete/d40_all_replicate_metrics.csv
            results/d40_complete/merge_audit.json
          retention-days: 30
