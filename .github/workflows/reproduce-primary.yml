name: Tests and reproducibility smoke test

on:
  workflow_dispatch:
  push:
    paths:
      - 'local_bic_refinement.py'
      - 'candidate_contamination_simulations.py'
      - 'tests/**'
      - 'reproduce_simulations.py'
      - 'simulation_diagnostics.py'
      - 'additional_noise_sensitivity.py'
      - 'realdata_postselection_diagnostics.py'
      - 'requirements.txt'
      - '.github/workflows/reproduce-primary.yml'
  pull_request:
    paths:
      - 'local_bic_refinement.py'
      - 'candidate_contamination_simulations.py'
      - 'tests/**'
      - 'reproduce_simulations.py'
      - 'simulation_diagnostics.py'
      - 'additional_noise_sensitivity.py'
      - 'realdata_postselection_diagnostics.py'
      - 'requirements.txt'
      - '.github/workflows/reproduce-primary.yml'

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Check analysis-script syntax
        run: |
          python -m py_compile \
            local_bic_refinement.py \
            reproduce_simulations.py \
            simulation_diagnostics.py \
            additional_noise_sensitivity.py \
            realdata_postselection_diagnostics.py \
            candidate_contamination_simulations.py
          python -c "import local_bic_refinement, reproduce_simulations, simulation_diagnostics, additional_noise_sensitivity, realdata_postselection_diagnostics, candidate_contamination_simulations"
      - name: Run deterministic unit tests
        run: python -m unittest discover -s tests -v
      - name: Run small reproducibility check
        run: |
          python reproduce_simulations.py \
            --d 10 \
            --weight-kind uniform \
            --M 1 \
            --n-jobs 1 \
            --out results/smoke_test
      - name: Verify expected outputs
        run: |
          test -s results/smoke_test/replicate_metrics.csv
          test -s results/smoke_test/summary.csv
          test -s results/smoke_test/combined.pdf
      - name: Run fixed-candidate contamination smoke test
        run: |
          python candidate_contamination_simulations.py \
            --replicates 1 \
            --out results/contamination_smoke_test
          test -s results/contamination_smoke_test/exact_greedy_paired_summary.csv
          test -s results/contamination_smoke_test/exact_greedy_contamination_comparison.pdf
