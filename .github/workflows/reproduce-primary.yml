name: Reproduce primary simulation figures

on:
  push:
    paths:
      - 'reproduce_primary_simulations.py'
      - '.github/workflows/reproduce-primary.yml'
  workflow_dispatch:

jobs:
  primary-simulations:
    strategy:
      fail-fast: false
      matrix:
        d: [10, 20, 40]
        weight_kind: [uniform, modnormal]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install recovered Colab environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            numpy==2.0.2 \
            scipy==1.16.3 \
            scikit-learn==1.6.1 \
            networkx==3.6.1 \
            pandas==2.2.2 \
            matplotlib==3.10.0 \
            joblib==1.5.3 \
            causal-learn==0.1.4.4 \
            python-igraph==1.0.0 \
            lingam==1.12.1
          python -m pip freeze > recovered_environment.txt
      - name: Run ${{ matrix.d }}-node ${{ matrix.weight_kind }} panel
        run: |
          python reproduce_primary_simulations.py \
            --d ${{ matrix.d }} \
            --weight-kind ${{ matrix.weight_kind }} \
            --M 20 \
            --n-jobs 2 \
            --out results/d${{ matrix.d }}_${{ matrix.weight_kind }}
      - name: Record provenance
        run: |
          cp recovered_environment.txt results/d${{ matrix.d }}_${{ matrix.weight_kind }}/
          echo "commit=${GITHUB_SHA}" > results/d${{ matrix.d }}_${{ matrix.weight_kind }}/github_provenance.txt
          echo "runner=${RUNNER_OS}" >> results/d${{ matrix.d }}_${{ matrix.weight_kind }}/github_provenance.txt
      - name: Upload panel results
        uses: actions/upload-artifact@v4
        with:
          name: primary-d${{ matrix.d }}-${{ matrix.weight_kind }}
          path: results/d${{ matrix.d }}_${{ matrix.weight_kind }}/
          retention-days: 30
